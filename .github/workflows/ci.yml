name: CI
on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_footballclub
          POSTGRES_USER: footballclub
          # Throwaway container that only lives for this job: no password, so no credential to store or leak.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U footballclub"
          --health-interval 5s
          --health-retries 10
    env:
      # Tests run on settings_test, which ignores every production variable and only accepts a local test database.
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_DB: test_footballclub
      TEST_POSTGRES_USER: footballclub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: pip install -r requirements.txt
      - run: python manage.py compilemessages
        env:
          DJANGO_DEBUG: "1"   # management commands load the settings, which require a secret key unless debug is on
      - run: python manage.py check
        env:
          DJANGO_DEBUG: "1"
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: "1"
      - run: python manage.py test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max