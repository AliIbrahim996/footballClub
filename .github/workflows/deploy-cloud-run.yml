name: Deploy API to Cloud Run
# UNTESTED TEMPLATE. Manual trigger. Contains no secrets and no secret values:
#   * authentication is Workload Identity Federation (short-lived, no JSON key stored in GitHub);
#   * configuration comes from repository *variables* (non-sensitive: hosts, names, bucket);
#   * sensitive values live only in Google Secret Manager and are mounted by reference below.
# One-time setup is described in the frontend repo's docs/DEPLOY.md.
#
# Repository variables: GCP_PROJECT, GCP_REGION, GCP_ARTIFACT_REPO, GCP_WIF_PROVIDER, GCP_DEPLOY_SA,
#   API_HOST, FRONTEND_URL, POSTGRES_HOST, POSTGRES_DB, POSTGRES_USER, GS_BUCKET_NAME
# Secret Manager secrets: django-secret-key, postgres-password, stripe-secret-key, stripe-webhook-secret
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.GCP_ARTIFACT_REPO }}/pitchside-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: pitchside-api
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated --port=8080
          env_vars: |
            DJANGO_DEBUG=0
            DJANGO_ALLOWED_HOSTS=${{ vars.API_HOST }}
            FRONTEND_URL=${{ vars.FRONTEND_URL }}
            POSTGRES_HOST=${{ vars.POSTGRES_HOST }}
            POSTGRES_DB=${{ vars.POSTGRES_DB }}
            POSTGRES_USER=${{ vars.POSTGRES_USER }}
            POSTGRES_SSLMODE=require
            MEDIA_STORAGE=gcs
            GS_BUCKET_NAME=${{ vars.GS_BUCKET_NAME }}
            NUM_PROXIES=2
          secrets: |
            DJANGO_SECRET_KEY=django-secret-key:latest
            POSTGRES_PASSWORD=postgres-password:latest
            STRIPE_SECRET_KEY=stripe-secret-key:latest
            STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest