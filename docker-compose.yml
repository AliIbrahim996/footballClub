# Backend stack: Django API + PostgreSQL.  Run: cp .env.example .env  (fill in the secrets)  then  docker compose up --build
# API: http://localhost:8000/api/docs/   Admin: http://localhost:8000/admin/
#
# No credentials live in this file: required secrets come from .env (or your shell) and compose refuses to start
# without them.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-footballclub}
      POSTGRES_USER: ${POSTGRES_USER:-footballclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://localhost:8000}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-footballclub}
      POSTGRES_USER: ${POSTGRES_USER:-footballclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      NUM_PROXIES: ${NUM_PROXIES:-1}
      # Uploads: local (volume below) by default, or s3 / gcs / azure; see web_application/storage.py
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      MEDIA_PUBLIC: ${MEDIA_PUBLIC:-1}
      MEDIA_ROOT: /data/media
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      GS_BUCKET_NAME: ${GS_BUCKET_NAME:-}
      AZURE_ACCOUNT_NAME: ${AZURE_ACCOUNT_NAME:-}
      AZURE_CONTAINER: ${AZURE_CONTAINER:-}
      # Demo data is off by default. When enabled the admin password comes from SEED_ADMIN_PASSWORD or is printed once.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-0}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Billing (optional): leave empty to run without Stripe.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      MAX_SEATS: ${MAX_SEATS:-5}
      # Invitation emails: set EMAIL_HOST (and creds) to send real mail; default prints to the log.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    volumes:
      - media:/data/media
    ports:
      - "8000:8000"

volumes:
  pgdata:
  media:
